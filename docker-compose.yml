version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sez_ledger_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount backend code for hot reload
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Mount resources directory for data files
      - ./resources:/app/resources
      # Preserve installed packages
      - backend_venv:/usr/local/lib/python3.11/site-packages
    environment:
      - DATABASE_URL=sqlite:///resources/sez_ledger.db
      - ANTHROPIC_MODEL=claude-3-5-sonnet-20241022
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
    env_file:
      - .env
    networks:
      - sez_ledger_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Frontend development server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sez_ledger_frontend
    ports:
      - "5173:5173"
    volumes:
      # Mount frontend code for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Preserve node_modules
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - sez_ledger_network
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL database (optional - can use SQLite)
  postgres:
    image: postgres:15-alpine
    container_name: sez_ledger_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sez_ledger
      - POSTGRES_PASSWORD=sez_ledger_password
      - POSTGRES_DB=sez_ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sez_ledger_network
    restart: unless-stopped
    profiles:
      - postgres  # Only start when explicitly requested

networks:
  sez_ledger_network:
    driver: bridge

volumes:
  backend_venv:
  frontend_node_modules:
  postgres_data:
