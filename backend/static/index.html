<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEZ Ledger Automation</title>
<link rel="icon" href="/static/amex-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ===== RESET & ROOT ===== */
:root {
  --oxblood: #941612;
  --oxblood-dark: #6e0f0c;
  --oxblood-light: rgba(148,22,18,.08);
  --charcoal: #575656;
  --brand-white: #fefdfd;
  --air-force-blue: #5e8197;
  --cool-steel: #9db2bf;
  --dusty-olive: #7e9478;
  --sidebar-width: 260px;
  --sidebar-collapsed: 64px;
  --header-height: 60px;
  --success: #2e7d32;
  --success-bg: rgba(46,125,50,.08);
  --warning: #e6a100;
  --warning-bg: rgba(230,161,0,.08);
  --error: #c62828;
  --error-bg: rgba(198,40,40,.08);
  --info: #5e8197;
  --info-bg: rgba(94,129,151,.08);
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.06);
  --transition: .2s ease;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height: 100%; }
body {
  font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
  color: var(--charcoal);
  background: #f4f5f7;
  height: 100%;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
  font-family: 'Merriweather', Georgia, serif;
  font-weight: 700;
  line-height: 1.3;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(87,86,86,.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(87,86,86,.35); }

/* ===== LOGIN ===== */
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #6e0f0c 0%, #941612 40%, #5e8197 100%);
  position: relative;
  overflow: hidden;
}
.login-page::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 100%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,.05) 0%, transparent 60%);
  animation: loginGlow 8s ease-in-out infinite alternate;
}
@keyframes loginGlow {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-10%, 5%); }
}
.login-card {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 420px;
  padding: 48px 40px 40px;
  position: relative;
  z-index: 2;
  animation: loginSlideUp .5s ease-out;
}
@keyframes loginSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
.login-logo {
  display: block;
  margin: 0 auto 24px;
  height: 44px;
}
.login-title {
  text-align: center;
  font-size: 24px;
  color: var(--oxblood);
  margin-bottom: 4px;
}
.login-subtitle {
  text-align: center;
  font-size: 13px;
  color: rgba(87,86,86,.6);
  margin-bottom: 32px;
  font-weight: 400;
}
.login-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(157,178,191,.3), transparent);
  margin-bottom: 28px;
}

/* ===== LAYOUT SHELL ===== */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-width);
  background: linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%);
  color: #fff;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  transition: width var(--transition);
  overflow: hidden;
}
.sidebar.collapsed {
  width: var(--sidebar-collapsed);
}
.sidebar-brand {
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  min-height: 64px;
  flex-shrink: 0;
}
.sidebar-brand img {
  height: 30px;
  flex-shrink: 0;
}
.sidebar-brand-text {
  white-space: nowrap;
  overflow: hidden;
}
.sidebar-brand-text h4 {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}
.sidebar-brand-text span {
  font-size: 10px;
  color: rgba(255,255,255,.45);
  text-transform: uppercase;
  letter-spacing: 1.2px;
}
.sidebar.collapsed .sidebar-brand-text { display: none; }

.sidebar-nav {
  flex: 1;
  padding: 12px 10px;
  overflow-y: auto;
}
.sidebar-nav-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,.3);
  padding: 16px 12px 6px;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar.collapsed .sidebar-nav-label { display: none; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.65);
  transition: all var(--transition);
  white-space: nowrap;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
  margin-bottom: 2px;
}
.nav-item:hover {
  background: rgba(255,255,255,.08);
  color: #fff;
}
.nav-item.active {
  background: var(--oxblood);
  color: #fff;
  box-shadow: 0 2px 8px rgba(148,22,18,.4);
}
.nav-item svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.sidebar.collapsed .nav-item span { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px; }

.sidebar-toggle {
  padding: 14px;
  border-top: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.sidebar-toggle button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.5);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  transition: all var(--transition);
}
.sidebar-toggle button:hover { background: rgba(255,255,255,.12); color: #fff; }
.sidebar-toggle button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sidebar.collapsed .sidebar-toggle button span { display: none; }

/* ===== MAIN CONTENT AREA ===== */
.main-area {
  flex: 1;
  margin-left: var(--sidebar-width);
  transition: margin-left var(--transition);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.sidebar.collapsed ~ .main-area,
.main-area.sidebar-collapsed {
  margin-left: var(--sidebar-collapsed);
}

/* ===== TOP HEADER BAR ===== */
.top-header {
  height: var(--header-height);
  background: #fff;
  border-bottom: 1px solid rgba(157,178,191,.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: 0 1px 3px rgba(0,0,0,.03);
}
.top-header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.top-header-left h2 {
  font-size: 18px;
  font-weight: 700;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: rgba(87,86,86,.5);
}
.breadcrumb a {
  color: var(--air-force-blue);
  text-decoration: none;
  cursor: pointer;
}
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: rgba(87,86,86,.3); }
.top-header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.user-badge {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--oxblood), var(--air-force-blue));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
}
.user-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--charcoal);
}
.user-role {
  font-size: 10px;
  color: rgba(87,86,86,.5);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.signout-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid rgba(157,178,191,.3);
  border-radius: 6px;
  background: none;
  color: var(--charcoal);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
}
.signout-btn:hover { border-color: var(--oxblood); color: var(--oxblood); }
.signout-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ===== CONTENT ===== */
.content {
  flex: 1;
  padding: 32px;
  max-width: 1280px;
  width: 100%;
}
.content-footer {
  border-top: 1px solid rgba(157,178,191,.12);
  padding: 16px 32px;
  text-align: center;
  font-size: 11px;
  color: rgba(87,86,86,.35);
}

/* ===== CARDS ===== */
.card {
  background: #fff;
  border: 1px solid rgba(157,178,191,.15);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: var(--shadow-md); }
.card-flat { box-shadow: none; }
.card-flat:hover { box-shadow: none; }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(157,178,191,.1);
}
.card-header h3 {
  font-size: 16px;
}
.card-np { padding: 0; }

/* ===== STAT CARDS ===== */
.stat-card {
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  opacity: .06;
  transform: translate(20px, -20px);
}
.stat-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.stat-card-icon svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.stat-val {
  font-size: 32px;
  font-weight: 300;
  line-height: 1;
  margin-bottom: 4px;
  font-family: 'Montserrat', sans-serif;
}
.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(87,86,86,.55);
  font-weight: 500;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
  line-height: 1.4;
  white-space: nowrap;
}
.btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn-primary { background: var(--oxblood); color: #fff; }
.btn-primary:hover { background: var(--oxblood-dark); box-shadow: 0 4px 12px rgba(148,22,18,.3); }
.btn-blue { background: var(--air-force-blue); color: #fff; }
.btn-blue:hover { background: #4d7085; box-shadow: 0 4px 12px rgba(94,129,151,.3); }
.btn-green { background: var(--dusty-olive); color: #fff; }
.btn-green:hover { background: #6a8063; }
.btn-gray { background: #f0f1f3; color: var(--charcoal); }
.btn-gray:hover { background: #e4e5e7; }
.btn-outline { background: transparent; border: 1px solid rgba(157,178,191,.35); color: var(--charcoal); }
.btn-outline:hover { background: rgba(157,178,191,.08); border-color: rgba(157,178,191,.5); }
.btn-danger { background: transparent; border: 1px solid rgba(198,40,40,.2); color: var(--error); }
.btn-danger:hover { background: var(--error-bg); }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 6px; }
.btn-lg { padding: 14px 28px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn-icon { padding: 8px; border-radius: 8px; background: none; border: none; color: var(--charcoal); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn-icon:hover { background: rgba(157,178,191,.1); }
.btn-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ===== FORM ELEMENTS ===== */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: rgba(87,86,86,.65);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid rgba(157,178,191,.35);
  border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  color: var(--charcoal);
  background: #fff;
  outline: none;
  transition: all var(--transition);
}
.form-input:focus {
  border-color: var(--air-force-blue);
  box-shadow: 0 0 0 3px rgba(94,129,151,.12);
}
.form-input:disabled {
  background: #f8f8f8;
  color: rgba(87,86,86,.5);
}
.form-input-error {
  border-color: var(--error);
}
.form-input-error:focus {
  box-shadow: 0 0 0 3px rgba(198,40,40,.1);
}
select.form-input {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23575656' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  padding-right: 36px;
}
.form-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
}
.form-check input[type="checkbox"],
.form-check input[type="radio"] {
  accent-color: var(--oxblood);
  width: 16px;
  height: 16px;
}

/* ===== GRID ===== */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-dash { grid-template-columns: 1fr 380px; }

/* ===== TABLE ===== */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(157,178,191,.15);
  background: #fff;
  box-shadow: var(--shadow-sm);
}
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl thead th {
  text-align: left;
  padding: 14px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: rgba(87,86,86,.6);
  background: #fafbfc;
  border-bottom: 1px solid rgba(157,178,191,.15);
  white-space: nowrap;
}
.tbl tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(157,178,191,.08);
  vertical-align: middle;
}
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr:nth-child(even) { background: #fafbfc; }
.tbl tbody tr.clickable { cursor: pointer; transition: background var(--transition); }
.tbl tbody tr.clickable:hover { background: rgba(94,129,151,.06); }
.tbl-right { text-align: right; }

/* ===== BADGES ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
}
.badge-green { background: var(--success-bg); color: var(--success); }
.badge-red { background: var(--error-bg); color: var(--error); }
.badge-blue { background: var(--info-bg); color: var(--info); }
.badge-yellow { background: var(--warning-bg); color: #856404; }
.badge-gray { background: #f0f1f3; color: var(--charcoal); }

/* ===== CONFIDENCE INDICATORS ===== */
.conf-high, .conf-med, .conf-low {
  position: relative;
}
.conf-high::after, .conf-med::after, .conf-low::after {
  content: '';
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.conf-high::after { background: var(--success); }
.conf-med::after { background: var(--warning); box-shadow: 0 0 0 3px rgba(230,161,0,.2); }
.conf-low::after { background: var(--error); box-shadow: 0 0 0 3px rgba(198,40,40,.2); }
.conf-high { border-color: var(--success); }
.conf-med { border-color: var(--warning); background: rgba(230,161,0,.03); }
.conf-low { border-color: var(--error); background: rgba(198,40,40,.03); }

/* ===== DROPZONE ===== */
.dropzone {
  border: 2px dashed rgba(157,178,191,.4);
  border-radius: var(--radius-lg);
  padding: 64px 32px;
  text-align: center;
  transition: all var(--transition);
  background: #fff;
  cursor: pointer;
}
.dropzone:hover {
  border-color: var(--air-force-blue);
  background: rgba(94,129,151,.03);
}
.dropzone.over {
  border-color: var(--air-force-blue);
  background: rgba(94,129,151,.06);
  box-shadow: 0 0 0 4px rgba(94,129,151,.1);
}
.dropzone-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: rgba(94,129,151,.08);
  display: flex;
  align-items: center;
  justify-content: center;
}
.dropzone-icon svg {
  width: 28px;
  height: 28px;
  stroke: var(--air-force-blue);
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
@keyframes pulse-border {
  0%, 100% { border-color: rgba(157,178,191,.4); }
  50% { border-color: var(--air-force-blue); }
}
.dropzone:hover { animation: pulse-border 2s infinite; }

/* ===== TOAST ===== */
.toast-container {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-radius: 10px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastSlideIn .35s ease-out;
  max-width: 420px;
  min-width: 280px;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--error); }
.toast-info { background: var(--info); }
.toast-warning { background: #b8860b; }
.toast-dismiss {
  background: none;
  border: none;
  color: rgba(255,255,255,.7);
  cursor: pointer;
  font-size: 18px;
  padding: 0 0 0 8px;
  margin-left: auto;
  line-height: 1;
}
.toast-dismiss:hover { color: #fff; }
@keyframes toastSlideIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes toastSlideOut {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(120%); opacity: 0; }
}

/* ===== TIMELINE ===== */
.timeline { position: relative; }
.timeline::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(157,178,191,.2);
}
.timeline-item {
  position: relative;
  padding: 0 0 20px 44px;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-dot {
  position: absolute;
  left: 8px;
  top: 4px;
  width: 16px;
  height: 16px;

function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---- API HELPERS ---- */
function api(path, opts) {
  opts = opts || {};
  var headers = {'Content-Type': 'application/json'};
  if (opts.headers) {
    var k;
    for (k in opts.headers) {
      if (opts.headers.hasOwnProperty(k)) headers[k] = opts.headers[k];
    }
  }
  var fetchOpts = {credentials: 'include', headers: headers};
  if (opts.method) fetchOpts.method = opts.method;
  if (opts.body) fetchOpts.body = opts.body;
  return fetch(API + path, fetchOpts).then(function(r) {
    if (!r.ok) {
      return r.json().catch(function() { return {detail: r.statusText}; }).then(function(b) {
        throw new Error(b.detail || 'HTTP ' + r.status);
      });
    }
    if (r.status === 204) return null;
    return r.json();
  });
}

function apiUpload(path, file) {
  var f = new FormData();
  f.append('file', file);
  return fetch(API + path, {method:'POST', credentials:'include', body:f}).then(function(r) {
    if (!r.ok) {
      return r.json().catch(function() { return {detail: r.statusText}; }).then(function(b) {
        throw new Error(b.detail || 'HTTP ' + r.status);
      });
    }
    return r.json();
  });
}

/* ---- TOAST SYSTEM ---- */
var toastCounter = 0;
function showToast(msg, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  if (!container) return;
  var id = 'toast-' + (++toastCounter);
  var iconSvg = '';
  if (type === 'success') iconSvg = ICONS.check;
  else if (type === 'error') iconSvg = ICONS.alertTriangle;
  else if (type === 'warning') iconSvg = ICONS.alertTriangle;
  else iconSvg = ICONS.activity;
  var html = '<div class="toast toast-' + type + '" id="' + id + '">'
    + '<span style="width:18px;height:18px;display:inline-flex;flex-shrink:0">' + iconSvg + '</span>'
    + '<span>' + esc(msg) + '</span>'
    + '<button class="toast-dismiss" onclick="dismissToast(\'' + id + '\')">&times;</button>'
    + '</div>';
  container.insertAdjacentHTML('beforeend', html);
  setTimeout(function() { dismissToast(id); }, 4000);
}

function dismissToast(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.style.animation = 'toastSlideOut .3s ease-in forwards';
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
}

/* ---- UPLOAD ---- */
var selectedFile = null;

function renderUpload(el, type) {
  var label = type === 'import' ? 'Import' : 'Export';
  setBreadcrumb([{label:'Upload'}, {label:label + ' Document'}]);
  el.innerHTML = '<div class="flex items-center justify-between mb-6">'
    + '<h2>Upload ' + label + ' Document</h2>'
    + '<div class="flex gap-3">'
    + '<button class="btn ' + (type === 'import' ? 'btn-primary' : 'btn-outline') + '" onclick="nav(\'upload-import\')">Import</button>'
    + '<button class="btn ' + (type === 'export' ? 'btn-blue' : 'btn-outline') + '" onclick="nav(\'upload-export\')">Export</button>'
    + '</div></div>'
    + '<div class="card mb-6">'
    + '<div class="dropzone" id="dz" onclick="document.getElementById(\'finput\').click()" ondragover="event.preventDefault();this.classList.add(\'over\')" ondragleave="this.classList.remove(\'over\')" ondrop="handleDrop(event,\'' + type + '\')">'
    + '<div class="dropzone-icon">' + ICONS.upload + '</div>'
    + '<p class="fw-600 mb-2" id="fname">Drop your PDF file here</p>'
    + '<p class="text-sm text-muted mb-4">or click to browse your files</p>'
    + '<input type="file" accept=".pdf" id="finput" style="display:none" onchange="handleFile(this.files[0],\'' + type + '\')">'
    + '<span class="badge badge-gray">PDF files only</span>'
    + '</div></div>'
    + '<div id="file-preview" class="hidden mb-6"></div>'
    + '<div id="upload-actions" class="hidden mb-6"></div>'
    + '<div id="upload-result"></div>';
}

function handleDrop(e, type) {
  e.preventDefault();
  var dz = document.getElementById('dz');
  if (dz) dz.classList.remove('over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], type);
}

function handleFile(f, type) {
  if (!f || !f.name.toLowerCase().endsWith('.pdf')) {
    showToast('Only PDF files are accepted', 'error');
    return;
  }
  selectedFile = f;
  var sizeKb = (f.size / 1024).toFixed(1);
  var preview = document.getElementById('file-preview');
  if (preview) {
    preview.classList.remove('hidden');
    preview.innerHTML = '<div class="card card-flat" style="border:1px solid rgba(94,129,151,.2);background:rgba(94,129,151,.03)">'
      + '<div class="flex items-center gap-4">'
      + '<div style="width:44px;height:44px;border-radius:10px;background:rgba(94,129,151,.1);display:flex;align-items:center;justify-content:center;color:var(--air-force-blue)">' + ICONS.file + '</div>'
      + '<div class="flex-1">'
      + '<div class="fw-600 text-sm">' + esc(f.name) + '</div>'
      + '<div class="text-xs text-muted">' + sizeKb + ' KB &mdash; PDF Document</div>'
      + '</div>'
      + '<button class="btn btn-sm btn-outline" onclick="clearFile(\'' + type + '\')">Remove</button>'
      + '</div></div>';
  }
  var actions = document.getElementById('upload-actions');
  if (actions) {
    actions.classList.remove('hidden');
    actions.innerHTML = '<button class="btn btn-primary btn-lg" onclick="doUpload(\'' + type + '\')">'
      + ICONS.upload + ' Upload & Process</button>';
  }
}

function clearFile(type) {
  selectedFile = null;
  var preview = document.getElementById('file-preview');
  var actions = document.getElementById('upload-actions');
  if (preview) { preview.classList.add('hidden'); preview.innerHTML = ''; }
  if (actions) { actions.classList.add('hidden'); actions.innerHTML = ''; }
}

function doUpload(type) {
  if (!selectedFile) return;
  var actions = document.getElementById('upload-actions');
  if (actions) {
    actions.innerHTML = '<div class="card card-flat flex items-center gap-4" style="padding:20px">'
      + '<div class="spinner"></div>'
      + '<span class="text-sm text-muted">Uploading document...</span>'
      + '</div>';
  }
  apiUpload('/' + type + '/upload', selectedFile).then(function(r) {
    var statusBadge = r.duplicate ? '<span class="badge badge-yellow">Duplicate Detected</span>' : '<span class="badge badge-green">Upload Successful</span>';
    var result = document.getElementById('upload-result');
    if (result) {
      result.innerHTML = '<div class="card">'
        + '<div class="flex items-center gap-3 mb-4">'
        + statusBadge
        + '<span class="text-sm">' + esc(r.message) + '</span>'
        + '</div>'
        + '<p class="text-sm text-muted mb-6">Choose how to extract data from this document:</p>'
        + '<div class="flex gap-3">'
        + '<button class="btn btn-primary" onclick="doExtract(' + r.document_id + ',\'' + type + '\',false)">'
        + ICONS.zap + ' Extract with AI</button>'
        + '<button class="btn btn-outline" onclick="doExtract(' + r.document_id + ',\'' + type + '\',true)">'
        + 'Use Mock Data</button>'
        + '</div></div>';
    }
    if (actions) actions.innerHTML = '';
  }).catch(function(e) {
    showToast(e.message, 'error');
    if (actions) actions.innerHTML = '<button class="btn btn-primary btn-lg" onclick="doUpload(\'' + type + '\')">' + ICONS.upload + ' Retry Upload</button>';
  });
}

function doExtract(docId, type, mock) {
  var result = document.getElementById('upload-result');
  if (result) {
    result.innerHTML = '<div class="card flex items-center gap-4" style="padding:32px;justify-content:center">'
      + '<div class="spinner spinner-lg"></div>'
      + '<div><div class="fw-600">Extracting data...</div>'
      + '<div class="text-sm text-muted">This may take a moment' + (mock ? '' : ' while AI processes the document') + '.</div></div>'
      + '</div>';
  }
  api('/' + type + '/extract/' + docId + '?use_mock=' + mock, {method:'POST'}).then(function(r) {
    if (r.error) {
      showToast(r.error, 'error');
      if (result) {
        result.innerHTML = '<div class="error-box">' + esc(r.error) + '</div>'
          + '<div class="flex gap-3" style="margin-top:12px">'
          + '<button class="btn btn-primary" onclick="doExtract(' + docId + ',\'' + type + '\',false)">'
          + ICONS.zap + ' Retry with AI</button>'
          + '<button class="btn btn-outline" onclick="doExtract(' + docId + ',\'' + type + '\',true)">'
          + 'Use Mock Data</button>'
          + '</div>';
      }
      return;
    }
    extractionData = r;
    nav(type === 'import' ? 'review-import' : 'review-export');
  }).catch(function(e) {
    showToast(e.message, 'error');
    if (result) result.innerHTML = '<div class="error-box">' + esc(e.message) + '</div>';
  });
}

/* ---- IMPORT REVIEW ---- */
function renderImportReview(el) {
  if (!extractionData) { nav('dashboard'); return; }
  setBreadcrumb([{label:'Upload', page:'upload-import'}, {label:'Review Import Data'}]);
  var entries = extractionData.import_entries || [];
  var fields = [
    ['consignor_exporter','Consignor/Exporter'],
    ['description','Description'],
    ['import_file_number','File Number'],
    ['import_entry_date','Entry Date'],
    ['import_entry_number','Entry Number'],
    ['hs_code','HS Code'],
    ['country','Country'],
    ['supplementary_units','Supplementary Units'],
    ['unit','Unit'],
    ['quantity_imported','Qty Imported'],
    ['customs_value_kes','Customs Value (KES)'],
    ['bif_value_kes','BIF Value (KES)']
  ];

  var itemsHtml = '';
  for (var idx = 0; idx < entries.length; idx++) {
    var entry = entries[idx];
    var fieldsHtml = '';
    for (var fi = 0; fi < fields.length; fi++) {
      var k = fields[fi][0];
      var l = fields[fi][1];
      var fld = entry[k] || {value: null, confidence: 1};
      var confVal = fld.confidence != null ? fld.confidence : 1;
      var confClass = '';
      if (confVal >= 0.8) confClass = 'conf-high';
      else if (confVal >= 0.5) confClass = 'conf-med';
      else confClass = 'conf-low';
      var confPct = (confVal * 100).toFixed(0);
      var sourceTitle = 'Confidence: ' + confPct + '%';
      if (fld.source_text) sourceTitle += ' | Source: ' + fld.source_text;
      fieldsHtml += '<div class="form-group mb-3">'
        + '<label class="form-label">' + esc(l) + '</label>'
        + '<input class="form-input ir ' + confClass + '" data-i="' + idx + '" data-k="' + k + '" value="' + esc(fld.value) + '" title="' + esc(sourceTitle) + '" style="padding-right:28px">'
        + '</div>';
    }
    itemsHtml += '<div class="card mb-4">'
      + '<div class="flex items-center justify-between mb-4">'
      + '<h3 style="font-size:16px">Item ' + (idx + 1) + ' of ' + entries.length + '</h3>'
      + '<span class="badge badge-blue">Import</span>'
      + '</div>'
      + '<div class="grid grid-3">' + fieldsHtml + '</div>'
      + '</div>';
  }

  el.innerHTML = '<div class="flex items-center justify-between mb-6">'
    + '<h2>Review Extracted Import Data</h2>'
    + '<span class="badge badge-gray">' + entries.length + ' item(s)</span>'
    + '</div>'
    + '<div class="card card-flat mb-4" style="background:rgba(94,129,151,.04);border:1px solid rgba(94,129,151,.15);padding:14px 20px">'
    + '<div class="flex items-center gap-3">'
    + '<span style="color:var(--info);display:inline-flex">' + ICONS.alertTriangle + '</span>'
    + '<span class="text-sm">Review and correct extracted values. '
    + '<span style="color:var(--success)">Green</span> = high confidence, '
    + '<span style="color:var(--warning)">Yellow</span> = medium, '
    + '<span style="color:var(--error)">Red</span> = low confidence.</span>'
    + '</div></div>'
    + '<div id="review-items">' + itemsHtml + '</div>'
    + '<div class="sticky-bottom">'
    + '<button class="btn btn-outline" onclick="nav(\'dashboard\')">Cancel</button>'
    + '<button class="btn btn-primary btn-lg" onclick="confirmImports()">'
    + ICONS.check + ' Confirm ' + entries.length + ' Item(s)</button>'
    + '</div>';
}

function confirmImports() {
  var inputs = document.querySelectorAll('.ir');
  var items = {};
  for (var i = 0; i < inputs.length; i++) {
    var inp = inputs[i];
    var idx = inp.getAttribute('data-i');
    var key = inp.getAttribute('data-k');
    if (!items[idx]) items[idx] = {};
    items[idx][key] = inp.value || null;
  }
  var keys = Object.keys(items);
  var payload = [];
  for (var j = 0; j < keys.length; j++) {
    var e = items[keys[j]];
    e.quantity_imported = Number(e.quantity_imported) || 0;
    e.customs_value_kes = Number(e.customs_value_kes) || 0;
    e.bif_value_kes = e.bif_value_kes ? Number(e.bif_value_kes) : null;
    e.supplementary_units = e.supplementary_units ? Number(e.supplementary_units) : null;
    payload.push(e);
  }
  var url = '/import/confirm';
  if (extractionData.document_id) url += '?source_document_id=' + extractionData.document_id;
  api(url, {method:'POST', body:JSON.stringify(payload)}).then(function() {
    showToast(payload.length + ' import line(s) confirmed successfully', 'success');
    extractionData = null;
    nav('dashboard');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function findMatches(idx) {
  var container = document.getElementById('candidates-' + idx);
  if (!container) return;
  container.innerHTML = '<div class="flex items-center gap-3" style="padding:12px"><div class="spinner"></div><span class="text-sm text-muted">Searching candidates...</span></div>';
  api('/export/match-candidates').then(function(r) {
    if (!r || r.length === 0) {
      container.innerHTML = '<div class="card card-flat" style="background:#fafbfc;text-align:center;padding:24px">'
        + '<p class="text-sm text-muted">No match candidates found.</p></div>';
      return;
    }
    var rows = '';
    for (var i = 0; i < r.length; i++) {
      var c = r[i];
      var desc = (c.description || '');
      if (desc.length > 55) desc = desc.substring(0, 55) + '...';
      var consignor = (c.consignor_exporter || '');
      if (consignor.length > 35) consignor = consignor.substring(0, 35) + '...';
      rows += '<tr class="clickable" onclick="selectMatch(' + idx + ',' + c.id + ')">'
        + '<td class="fw-600">#' + esc(c.id) + '</td>'
        + '<td class="text-sm">' + esc(desc) + '</td>'
        + '<td><span class="badge badge-blue">' + esc(c.hs_code || '-') + '</span></td>'
        + '<td class="tbl-right fw-600">' + (c.balance_quantity != null ? c.balance_quantity.toLocaleString() : '-') + ' ' + esc(c.unit || '') + '</td>'
        + '<td class="text-sm text-muted">' + esc(consignor) + '</td>'
        + '</tr>';
    }
    container.innerHTML = '<div class="table-wrap" style="max-height:240px;overflow-y:auto;margin-top:8px">'
      + '<table class="tbl"><thead><tr>'
      + '<th>ID</th><th>Description</th><th>HS</th><th class="tbl-right">Balance</th><th>Consignor</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }).catch(function(e) {
    showToast(e.message, 'error');
    container.innerHTML = '';
  });
}

function selectMatch(idx, importId) {
  var matchEl = document.getElementById('match-' + idx);
  var matchIdEl = document.getElementById('matchid-' + idx);
  var candidatesEl = document.getElementById('candidates-' + idx);
  if (matchIdEl) matchIdEl.value = importId;
  if (matchEl) matchEl.innerHTML = '<span class="badge badge-green">Import Line #' + importId + '</span>';
  if (candidatesEl) candidatesEl.innerHTML = '';

  var qtyInput = document.querySelector('.er[data-i="' + idx + '"][data-k="quantity_exported"]');
  var qty = qtyInput ? Number(qtyInput.value) : 0;
  if (qty > 0) {
    api('/export/preview-proration?import_line_id=' + importId + '&quantity_exported=' + qty, {method:'POST'}).then(function(p) {
      var proEl = document.getElementById('proration-' + idx);
      if (!proEl) return;
      var bgStyle = p.overdraft ? 'background:var(--error-bg);border-left:3px solid var(--error)' : 'background:var(--success-bg);border-left:3px solid var(--success)';
      var overdraftHtml = p.overdraft ? '<div class="fw-600 text-sm" style="color:var(--error);margin-top:8px">' + esc(p.overdraft_message) + '</div>' : '';

function toggleOverrideReason() {
  var chk = document.getElementById('admin-override-chk');
  var wrap = document.getElementById('override-reason-wrap');
  if (wrap) wrap.style.display = (chk && chk.checked) ? 'block' : 'none';
}

function confirmExports() {
  var inputs = document.querySelectorAll('.er');
  var items = {};
  for (var i = 0; i < inputs.length; i++) {
    var inp = inputs[i];
    var idx = inp.getAttribute('data-i');
    var key = inp.getAttribute('data-k');
    if (!items[idx]) items[idx] = {};
    items[idx][key] = inp.value || null;
  }
  var keys = Object.keys(items);
  var payload = [];
  for (var j = 0; j < keys.length; j++) {
    var e = items[keys[j]];
    var matchIdEl = document.getElementById('matchid-' + keys[j]);
    e.import_line_id = matchIdEl ? Number(matchIdEl.value) : 0;
    e.quantity_exported = Number(e.quantity_exported) || 0;
    e.customs_value_exported = e.customs_value_exported ? Number(e.customs_value_exported) : null;
    e.bif_value_exported = e.bif_value_exported ? Number(e.bif_value_exported) : null;
    e.supplementary_units_exported = e.supplementary_units_exported ? Number(e.supplementary_units_exported) : null;
    payload.push(e);
  }
  for (var pi = 0; pi < payload.length; pi++) {
    if (!payload[pi].import_line_id) {
      showToast('Please select an import line for each export item', 'error');
      return;
    }
  }

  var overrideChk = document.getElementById('admin-override-chk');
  var overrideOn = !!(overrideChk && overrideChk.checked);
  var overrideReason = '';
  if (overrideOn) {
    var reasonEl = document.getElementById('admin-override-reason');
    overrideReason = reasonEl ? reasonEl.value.trim() : '';
    if (!overrideReason) {
      showToast('Enter a reason for the admin override', 'error');
      return;
    }
  }

  var url = '/export/confirm';
  var qs = [];
  if (extractionData.document_id) qs.push('source_document_id=' + extractionData.document_id);
  if (overrideOn) {
    qs.push('admin_override=true');
    qs.push('override_reason=' + encodeURIComponent(overrideReason));
  }
  if (qs.length) url += '?' + qs.join('&');

  api(url, {method:'POST', body:JSON.stringify(payload)}).then(function() {
    showToast(payload.length + ' export(s) confirmed successfully', 'success');
    extractionData = null;
    nav('dashboard');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function doSearch() {
  var p = new URLSearchParams();
  function addParam(k, id) { var v = document.getElementById(id); if (v && v.value) p.set(k, v.value); }
  addParam('entry_number', 's_en');
  addParam('file_number', 's_fn');
  addParam('description', 's_desc');
  addParam('consignor', 's_con');
  addParam('hs_code', 's_hs');
  addParam('country', 's_co');
  var obEl = document.getElementById('s_ob');
  if (obEl && obEl.checked) p.set('open_balance_only', 'true');

  var resultsEl = document.getElementById('search-results');
  var detailEl = document.getElementById('search-detail');
  if (detailEl) detailEl.innerHTML = '';
  if (resultsEl) resultsEl.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Searching...</p></div>';

  api('/ledger/search?' + p).then(function(r) {
    searchResults = r || [];
    searchPage = 0;
    renderSearchResults();
  }).catch(function(e) {
    showToast(e.message, 'error');
    if (resultsEl) resultsEl.innerHTML = '';
  });
}

function renderSearchResults() {
  var resultsEl = document.getElementById('search-results');
  if (!resultsEl) return;
  if (searchResults.length === 0) {
    resultsEl.innerHTML = '<div class="card"><div class="empty-state">'
      + ICONS.search
      + '<h3>No Results Found</h3>'
      + '<p>Try adjusting your search filters or clear them to see all records.</p>'
      + '</div></div>';
    return;
  }

  var totalPages = Math.ceil(searchResults.length / ITEMS_PER_PAGE);
  var start = searchPage * ITEMS_PER_PAGE;
  var end = Math.min(start + ITEMS_PER_PAGE, searchResults.length);
  var pageItems = searchResults.slice(start, end);

  var rows = '';
  for (var i = 0; i < pageItems.length; i++) {
    var item = pageItems[i];
    var balColor = item.balance_quantity > 0 ? 'color:var(--success);font-weight:600' : 'color:var(--charcoal)';
    rows += '<tr class="clickable" onclick="viewDetail(' + item.id + ')">'
      + '<td class="fw-600">#' + esc(item.id) + '</td>'
      + '<td>' + esc(item.import_entry_number || '-') + '</td>'
      + '<td><span class="truncate">' + esc(item.description || '-') + '</span></td>'
      + '<td><span class="badge badge-blue">' + esc(item.hs_code || '-') + '</span></td>'
      + '<td class="tbl-right">' + (item.quantity_imported != null ? item.quantity_imported.toLocaleString() : '-') + '</td>'
      + '<td class="tbl-right" style="' + balColor + '">' + (item.balance_quantity != null ? item.balance_quantity.toLocaleString() : '-') + '</td>'
      + '<td class="tbl-right">' + (item.balance_customs_value != null ? item.balance_customs_value.toLocaleString() : '-') + '</td>'
      + '</tr>';
  }

  var paginationHtml = '';
  if (totalPages > 1) {
    paginationHtml = '<div class="pagination">';
    paginationHtml += '<button class="page-btn" onclick="searchPageNav(' + (searchPage - 1) + ')"' + (searchPage === 0 ? ' disabled' : '') + '>&laquo; Prev</button>';
    for (var pg = 0; pg < totalPages; pg++) {
      paginationHtml += '<button class="page-btn' + (pg === searchPage ? ' active' : '') + '" onclick="searchPageNav(' + pg + ')">' + (pg + 1) + '</button>';
    }
    paginationHtml += '<button class="page-btn" onclick="searchPageNav(' + (searchPage + 1) + ')"' + (searchPage >= totalPages - 1 ? ' disabled' : '') + '>Next &raquo;</button>';
    paginationHtml += '</div>';
  }

  resultsEl.innerHTML = '<div class="flex items-center justify-between mb-3">'
    + '<span class="text-sm text-muted">' + searchResults.length + ' result(s) found</span>'
    + '</div>'
    + '<div class="table-wrap"><table class="tbl">'
    + '<thead><tr>'
    + '<th>ID</th><th>Entry #</th><th>Description</th><th>HS Code</th>'
    + '<th class="tbl-right">Qty Imported</th><th class="tbl-right">Balance</th><th class="tbl-right">Value (KES)</th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>'
    + paginationHtml
    + '</div>';
}

function searchPageNav(pg) {
  var totalPages = Math.ceil(searchResults.length / ITEMS_PER_PAGE);
  if (pg < 0 || pg >= totalPages) return;
  searchPage = pg;
  renderSearchResults();
}

function loadAudit() {
  var p = new URLSearchParams();
  var etEl = document.getElementById('a_et');
  var ctEl = document.getElementById('a_ct');
  if (etEl && etEl.value) p.set('entity_type', etEl.value);
  if (ctEl && ctEl.value) p.set('change_type', ctEl.value);

  api('/ledger/audit?' + p).then(function(r) {
    var container = document.getElementById('audit-table');
    if (!container) return;

    if (!r || r.length === 0) {
      container.innerHTML = '<div class="card"><div class="empty-state">'
        + ICONS.audit
        + '<h3>No Audit Entries</h3>'
        + '<p>Audit events will appear here as changes are made to the ledger.</p>'
        + '</div></div>';
      return;
    }

    /* timeline view */
    var timelineHtml = '<div class="timeline">';
    for (var i = 0; i < r.length; i++) {
      var entry = r[i];
      var dotClass = 'timeline-dot-blue';
      var badgeClass = 'badge-blue';
      if (entry.change_type === 'create') { dotClass = 'timeline-dot-green'; badgeClass = 'badge-green'; }
      else if (entry.change_type === 'delete') { dotClass = 'timeline-dot-red'; badgeClass = 'badge-red'; }
      else if (entry.change_type === 'override') { dotClass = 'timeline-dot-yellow'; badgeClass = 'badge-yellow'; }

      var detailStr = '';
      if (entry.field_name) {
        detailStr = ' &mdash; <span class="text-muted">' + esc(entry.field_name) + '</span>';
        if (entry.old_value || entry.new_value) {
          detailStr += ': ';
          if (entry.old_value) detailStr += '<span style="text-decoration:line-through;color:var(--error)">' + esc(String(entry.old_value).substring(0, 40)) + '</span>';
          if (entry.old_value && entry.new_value) detailStr += ' &rarr; ';
          if (entry.new_value) detailStr += '<span style="color:var(--success)">' + esc(String(entry.new_value).substring(0, 40)) + '</span>';
        }
      }

      timelineHtml += '<div class="timeline-item">'
        + '<div class="timeline-dot ' + dotClass + '"></div>'
        + '<div class="timeline-content">'
        + '<span class="badge ' + badgeClass + '" style="margin-right:8px">' + esc(entry.change_type) + '</span>'
        + '<span class="text-sm fw-600">' + esc(entry.entity_type) + ' #' + esc(entry.entity_id) + '</span>'
        + detailStr
        + '<span class="text-xs text-muted" style="margin-left:8px">via ' + esc(entry.source) + '</span>'
        + '<div class="timeline-time">' + new Date(entry.created_at).toLocaleString() + '</div>'
        + '</div></div>';
    }
    timelineHtml += '</div>';

    container.innerHTML = '<div class="card">'
      + '<div class="flex items-center justify-between mb-4">'
      + '<span class="text-sm text-muted">' + r.length + ' entries</span>'
      + '</div>'
      + timelineHtml + '</div>';
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

      resultEl.innerHTML = '<div class="success-box mt-4">'
        + '<div class="fw-600 mb-2">Legacy Import Complete</div>'
        + '<div class="text-sm">Import lines created: <b>' + esc(r.import_lines_created) + '</b></div>'
        + '<div class="text-sm">Export lines created: <b>' + esc(r.export_lines_created) + '</b></div>'
        + '<div class="text-sm">Skipped (empty): <b>' + esc(r.skipped_empty) + '</b></div>'
        + warningsHtml + '</div>';
    }
    showToast('Legacy import completed successfully', 'success');
  }).catch(function(e) {
    showToast(e.message, 'error');
    if (resultEl) resultEl.innerHTML = '<div class="error-box mt-4">' + esc(e.message) + '</div>';
  });
}

/* ---- ADMIN ---- */
var adminActiveTab = 'users';

function renderAdmin(el) {
  if (!currentUser.is_admin) { nav('dashboard'); return; }
  setBreadcrumb([{label:'Admin'}]);
  el.innerHTML = '<div class="flex items-center justify-between mb-6">'
    + '<h2>Admin Panel</h2>'
    + '</div>'
    + '<div class="tabs" id="admin-tabs">'
    + '<button class="tab-btn active" data-tab="users" onclick="adminTab(\'users\')">Users</button>'
    + '<button class="tab-btn" data-tab="units" onclick="adminTab(\'units\')">Units</button>'
    + '<button class="tab-btn" data-tab="countries" onclick="adminTab(\'countries\')">Countries</button>'
    + '<button class="tab-btn" data-tab="settings" onclick="adminTab(\'settings\')">Settings</button>'
    + '</div>'
    + '<div id="admin-content"><div class="loading-state"><div class="spinner"></div><p>Loading...</p></div></div>';
  adminActiveTab = 'users';
  adminTab('users');
}

function adminTab(tab) {
  adminActiveTab = tab;
  /* update tab buttons */
  var btns = document.querySelectorAll('#admin-tabs .tab-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
  }
  var el = document.getElementById('admin-content');
  if (!el) return;

  if (tab === 'users') {
    renderAdminUsers(el);
  } else if (tab === 'units') {
    renderAdminUnits(el);
  } else if (tab === 'countries') {
    renderAdminCountries(el);
  } else if (tab === 'settings') {
    renderAdminSettings(el);
  }
}

function renderAdminUsers(el) {
  el.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading users...</p></div>';
  api('/admin/users').then(function(users) {
    var rows = '';
    for (var i = 0; i < users.length; i++) {
      var u = users[i];
      var adminBadge = u.is_admin ? '<span class="badge badge-red">Admin</span>' : '<span class="badge badge-gray">User</span>';
      var activeBadge = u.is_active ? '<span class="badge badge-green">Active</span>' : '<span class="badge badge-red">Inactive</span>';
      var toggleAdminLabel = u.is_admin ? 'Demote' : 'Promote';
      var toggleActiveLabel = u.is_active ? 'Deactivate' : 'Activate';
      var actions = '';
      if (u.id !== currentUser.id) {
        actions = '<div class="flex gap-2">'
          + '<button class="btn btn-sm btn-outline" onclick="toggleAdmin(' + u.id + ',' + (!u.is_admin) + ')">' + toggleAdminLabel + '</button>'
          + '<button class="btn btn-sm btn-outline" onclick="toggleActive(' + u.id + ',' + (!u.is_active) + ')">' + toggleActiveLabel + '</button>'
          + '<button class="btn btn-sm btn-danger" onclick="delUser(' + u.id + ')">' + ICONS.trash + '</button>'
          + '</div>';
      } else {
        actions = '<span class="text-xs text-muted">Current User</span>';
      }
      rows += '<tr>'
        + '<td class="fw-600">' + esc(u.id) + '</td>'
        + '<td class="fw-600">' + esc(u.username) + '</td>'
        + '<td>' + adminBadge + '</td>'
        + '<td>' + activeBadge + '</td>'
        + '<td class="text-sm text-muted">' + new Date(u.created_at).toLocaleDateString() + '</td>'
        + '<td>' + actions + '</td>'
        + '</tr>';
    }

    el.innerHTML = '<div class="card mb-6" id="create-user-card">'
      + '<div class="card-header">'
      + '<h3>Create New User</h3>'
      + '</div>'
      + '<div class="grid grid-3" style="grid-template-columns:1fr 1fr auto auto">'
      + '<div class="form-group mb-0"><label class="form-label">Username</label><input class="form-input" id="nu_u" placeholder="Enter username"></div>'
      + '<div class="form-group mb-0"><label class="form-label">Password</label><input class="form-input" id="nu_p" type="password" placeholder="Enter password"></div>'
      + '<label class="form-check" style="margin-top:22px"><input type="checkbox" id="nu_a"> Admin</label>'
      + '<button class="btn btn-primary" style="margin-top:18px" onclick="createUserAdmin()">' + ICONS.users + ' Create</button>'
      + '</div></div>'
      + '<div class="table-wrap"><table class="tbl"><thead><tr>'
      + '<th>ID</th><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }).catch(function(e) {
    showToast(e.message, 'error');
    el.innerHTML = '<div class="error-box">' + esc(e.message) + '</div>';
  });
}

function renderAdminUnits(el) {
  el.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading units...</p></div>';
  api('/admin/units').then(function(units) {
    var badgesHtml = '';
    if (units.length === 0) {
      badgesHtml = '<div class="empty-state"><p class="text-muted text-sm">No units configured yet.</p></div>';
    } else {
      badgesHtml = '<div class="flex flex-wrap gap-3" style="padding:8px 0">';
      for (var i = 0; i < units.length; i++) {
        var desc = units[i].description ? ' - ' + units[i].description : '';
        badgesHtml += '<span class="badge badge-blue" style="padding:8px 16px;font-size:13px">' + esc(units[i].code) + esc(desc) + '</span>';
      }
      badgesHtml += '</div>';
    }

    el.innerHTML = '<div class="card mb-6">'
      + '<div class="card-header"><h3>Add Unit of Measure</h3></div>'
      + '<div class="flex items-center gap-3">'
      + '<div class="form-group mb-0"><label class="form-label">Code</label><input class="form-input" id="nu_code" style="width:100px" placeholder="KG"></div>'
      + '<div class="form-group mb-0"><label class="form-label">Description</label><input class="form-input" id="nu_desc" placeholder="Kilograms"></div>'
      + '<button class="btn btn-primary" style="margin-top:18px" onclick="addUnit()">Add Unit</button>'
      + '</div></div>'
      + '<div class="card"><div class="card-header"><h3>Configured Units (' + units.length + ')</h3></div>'
      + badgesHtml + '</div>';
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function renderAdminCountries(el) {
  el.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading countries...</p></div>';
  api('/admin/countries').then(function(countries) {
    var badgesHtml = '';
    if (countries.length === 0) {
      badgesHtml = '<div class="empty-state"><p class="text-muted text-sm">No countries configured yet.</p></div>';
    } else {
      badgesHtml = '<div class="flex flex-wrap gap-3" style="padding:8px 0">';
      for (var i = 0; i < countries.length; i++) {
        badgesHtml += '<span class="badge badge-blue" style="padding:8px 16px;font-size:13px">' + esc(countries[i].code) + ' - ' + esc(countries[i].name) + '</span>';
      }
      badgesHtml += '</div>';
    }

    el.innerHTML = '<div class="card mb-6">'
      + '<div class="card-header"><h3>Add Country</h3></div>'
      + '<div class="flex items-center gap-3">'
      + '<div class="form-group mb-0"><label class="form-label">ISO Code</label><input class="form-input" id="nc_code" style="width:80px" maxlength="2" placeholder="KE"></div>'
      + '<div class="form-group mb-0"><label class="form-label">Country Name</label><input class="form-input" id="nc_name" placeholder="Kenya"></div>'
      + '<button class="btn btn-primary" style="margin-top:18px" onclick="addCountry()">Add Country</button>'
      + '</div></div>'
      + '<div class="card"><div class="card-header"><h3>Configured Countries (' + countries.length + ')</h3></div>'
      + badgesHtml + '</div>';
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function renderAdminSettings(el) {
  el.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading settings...</p></div>';
  api('/admin/settings').then(function(settings) {
    /* GET /admin/settings returns {key: {value, updated_at}} -- the API
       key's value already comes back pre-masked ("***xxxxxxxx") from the
       backend, so just display it as-is rather than re-deriving it here. */
    var apiKeyDisplay = (settings && settings.anthropic_api_key && settings.anthropic_api_key.value) || '(not set)';
    var currentModel = (settings && settings.model && settings.model.value) || '';

    el.innerHTML = '<div class="card mb-6">'
      + '<div class="card-header">'
      + '<h3>API Configuration</h3>'
      + '<span style="color:var(--air-force-blue);display:inline-flex">' + ICONS.key + '</span>'
      + '</div>'
      + '<div class="form-group">'
      + '<label class="form-label">API Key</label>'
      + '<div class="flex items-center gap-3">'
      + '<div class="flex-1" style="position:relative">'
      + '<input class="form-input" id="settings_api_key" type="password" placeholder="Enter new API key" value="">'
      + '<div class="text-xs text-muted" style="margin-top:4px">Current: <code style="background:#f0f1f3;padding:2px 6px;border-radius:4px">' + esc(apiKeyDisplay) + '</code></div>'
      + '</div>'
      + '<button class="btn btn-outline" style="margin-top:-14px" onclick="updateSetting(\'anthropic_api_key\', document.getElementById(\'settings_api_key\').value)">Update Key</button>'
      + '</div></div>'
      + '<div class="form-group mb-0">'
      + '<label class="form-label">AI Model</label>'
      + '<div class="flex items-center gap-3">'
      + '<select class="form-input" id="settings_model" style="width:340px">'
      + '<option value="claude-sonnet-5"' + (currentModel === 'claude-sonnet-5' ? ' selected' : '') + '>Claude Sonnet 5</option>'
      + '<option value="claude-opus-5-5"' + (currentModel === 'claude-opus-5-5' ? ' selected' : '') + '>Claude Opus 5.5</option>'
      + '<option value="claude-haiku-4-5-20251001"' + (currentModel === 'claude-haiku-4-5-20251001' ? ' selected' : '') + '>Claude Haiku 4.5</option>'
      + '</select>'
      + '<button class="btn btn-primary" onclick="updateSetting(\'model\', document.getElementById(\'settings_model\').value)">Save Model</button>'
      + '</div></div>'
      + '</div>';
  }).catch(function(e) {
    /* If settings endpoint doesn't exist yet, show form anyway */
    el.innerHTML = '<div class="card mb-6">'
      + '<div class="card-header">'
      + '<h3>API Configuration</h3>'
      + '<span style="color:var(--air-force-blue);display:inline-flex">' + ICONS.key + '</span>'
      + '</div>'
      + '<div class="form-group">'
      + '<label class="form-label">API Key</label>'
      + '<div class="flex items-center gap-3">'
      + '<input class="form-input flex-1" id="settings_api_key" type="password" placeholder="Enter API key">'
      + '<button class="btn btn-outline" onclick="updateSetting(\'anthropic_api_key\', document.getElementById(\'settings_api_key\').value)">Update Key</button>'
      + '</div></div>'
      + '<div class="form-group mb-0">'
      + '<label class="form-label">AI Model</label>'
      + '<div class="flex items-center gap-3">'
      + '<select class="form-input" id="settings_model" style="width:340px">'
      + '<option value="claude-sonnet-5">Claude Sonnet 5</option>'
      + '<option value="claude-opus-5-5">Claude Opus 5.5</option>'
      + '<option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>'
      + '</select>'
      + '<button class="btn btn-primary" onclick="updateSetting(\'model\', document.getElementById(\'settings_model\').value)">Save Model</button>'
      + '</div></div>'
      + '</div>';
  });
}

function updateSetting(key, value) {
  if (!value) {
    showToast('Please enter a value', 'warning');
    return;
  }
  api('/admin/settings/' + key, {method:'PUT', body:JSON.stringify({value:value})}).then(function() {
    showToast('Setting "' + key + '" updated successfully', 'success');
    if (key === 'anthropic_api_key') {
      var inputEl = document.getElementById('settings_api_key');
      if (inputEl) inputEl.value = '';
      adminTab('settings'); /* refresh to show masked key */
    }
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

/* Admin CRUD helpers */
function createUserAdmin() {
  var uEl = document.getElementById('nu_u');
  var pEl = document.getElementById('nu_p');
  var aEl = document.getElementById('nu_a');
  if (!uEl || !pEl || !uEl.value || !pEl.value) {
    showToast('Username and password are required', 'warning');
    return;
  }
  api('/admin/users', {method:'POST', body:JSON.stringify({
    username: uEl.value,
    password: pEl.value,
    is_admin: aEl ? aEl.checked : false
  })}).then(function() {
    showToast('User created successfully', 'success');
    adminTab('users');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function toggleAdmin(id, val) {
  api('/admin/users/' + id, {method:'PUT', body:JSON.stringify({is_admin:val})}).then(function() {
    adminTab('users');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function toggleActive(id, val) {
  api('/admin/users/' + id, {method:'PUT', body:JSON.stringify({is_active:val})}).then(function() {
    adminTab('users');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function delUser(id) {
  if (!confirm('Are you sure you want to delete this user?')) return;
  api('/admin/users/' + id, {method:'DELETE'}).then(function() {
    showToast('User deleted', 'success');
    adminTab('users');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function addUnit() {
  var codeEl = document.getElementById('nu_code');
  var descEl = document.getElementById('nu_desc');
  if (!codeEl || !codeEl.value) { showToast('Unit code is required', 'warning'); return; }
  api('/admin/units', {method:'POST', body:JSON.stringify({
    code: codeEl.value.toUpperCase(),
    description: descEl ? descEl.value : ''
  })}).then(function() {
    showToast('Unit added successfully', 'success');
    adminTab('units');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

function addCountry() {
  var codeEl = document.getElementById('nc_code');
  var nameEl = document.getElementById('nc_name');
  if (!codeEl || !codeEl.value || !nameEl || !nameEl.value) {
    showToast('Both code and name are required', 'warning');
    return;
  }
  api('/admin/countries', {method:'POST', body:JSON.stringify({
    code: codeEl.value.toUpperCase(),
    name: nameEl.value
  })}).then(function() {
    showToast('Country added successfully', 'success');
    adminTab('countries');
  }).catch(function(e) {
    showToast(e.message, 'error');
  });
}

/* ---- INIT ---- */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !currentUser) {
    doLogin();
  }
});

api('/auth/me').then(function(u) {
  currentUser = u;
  render();
}).catch(function() {
  currentUser = null;
  render();
});
</script>
